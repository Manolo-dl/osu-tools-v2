<div class="page-container">
  <header>
    <h1 tuiTitle="l">Downloader</h1>
    <p class="page-desc">Download beatmap sets directly to your Songs folder.</p>
  </header>

  <!-- TODO INSTRUCTIONS -->
  <!-- <section>
  </section> -->

  <section>
    <h2 tuiTitle="m">Session</h2>
    <app-osu-cookie-input />
  </section>

  @if (!osuDb.isLoaded()) {
    <div
      size="l"
      tuiNotification
    >
      <div
        tuiTitle="m"
        [style.padding-inline-end.rem]="2"
      >
        Library not loaded
        <div tuiSubtitle>Load your osu! library to automatically skip maps you already own.</div>
        <div>
          <button
            appearance="primary"
            size="m"
            tuiButton
            [disabled]="osuDb.isLoading()"
            (click)="loadLibrary()"
          >
            {{ osuDb.isLoading() ? 'Loading…' : 'Load library' }}
          </button>
        </div>
      </div>
    </div>
  }

  <section>
    <h2 tuiTitle="m">Import</h2>
    <app-beatmap-import />
  </section>

  <section>
    <h2 tuiTitle="m">Download Queue</h2>
    <app-beatmap-queue />
  </section>

</div>
