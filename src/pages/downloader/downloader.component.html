<div class="downloader-page">

  <header class="page-header">
    <h1 class="page-title">Downloader</h1>
    <p class="page-desc">Download beatmap sets directly to your Songs folder.</p>
  </header>

  <section class="section">
    <h2 class="section-title">Session</h2>
    <app-osu-cookie-input />
  </section>

  @if (userStore.user()?.osuSession) {
    <section class="section">
      <h2 class="section-title">Import</h2>
      <app-beatmap-import />
    </section>

    <section class="section">
      <h2 class="section-title">Download Queue</h2>
      <app-beatmap-queue />
    </section>
  }

</div>
