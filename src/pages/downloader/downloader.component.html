<div class="downloader-page">

  <header class="page-header">
    <h1 class="page-title">Downloader</h1>
    <p class="page-desc">Download beatmap sets directly to your Songs folder.</p>
  </header>

  <section class="section">
    <h2 class="section-title">Session</h2>
    <app-osu-cookie-input />
  </section>

  @if (userStore.user()?.osuSession) {
    @if (!osuDb.isLoaded()) {
      <div class="notice">
        <div class="notice-body">
          <strong>Library not loaded</strong>
          <span>Load your osu! library to automatically skip maps you already own.</span>
        </div>
        <button class="btn-load" [disabled]="osuDb.isLoading()" (click)="loadLibrary()">
          {{ osuDb.isLoading() ? 'Loading…' : 'Load library' }}
        </button>
      </div>
    }

    <section class="section">
      <h2 class="section-title">Import</h2>
      <app-beatmap-import />
    </section>

    <section class="section">
      <h2 class="section-title">Download Queue</h2>
      <app-beatmap-queue />
    </section>
  }

</div>
