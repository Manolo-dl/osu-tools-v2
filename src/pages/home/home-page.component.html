<div class="home">

  <div class="hero">
    <h1 class="hero-title">osu<span class="accent">-tools</span></h1>
    <p class="hero-subtitle">Manage your osu! library — download beatmaps, export collections, and more.</p>
  </div>

  @if (!osuPath.isLoading() && !osuPath.path()) {
    <div class="path-warning">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>
        <strong>osu! folder not found</strong> — the tools are locked until you set it.
        Use the <strong>osu! folder</strong> bar at the top of the screen to detect or select it manually.
      </span>
    </div>
  }


</div>
