<div class="logs-page">
  <header class="page-header">
    <div class="header-left">
      <h1 class="page-title">Logs</h1>
      <span class="total-badge">{{ store.totalLogs() }} entries</span>
    </div>
    <button class="btn-reload" (click)="reload()">Reload</button>
  </header>

  <div class="columns">
    @for (level of ['INFO', 'WARN', 'ERROR']; track level) {
      <app-log-column
        [level]="level"
        [groups]="store.groupedLogs()[level]"
      />
    }
  </div>
</div>
