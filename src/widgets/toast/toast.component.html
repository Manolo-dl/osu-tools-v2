<div class="toast-container">
  @for (toast of store.toasts(); track toast.id) {
    <div class="toast" [ngClass]="toast.type">
      <span class="toast-icon">
        @switch (toast.type) {
          @case ('success') { ✓ }
          @case ('error') { ✕ }
          @case ('warning') { ⚠ }
          @case ('info') { ℹ }
        }
      </span>
      <span class="toast-message">{{ toast.message }}</span>
      <button class="toast-close" (click)="store.dismiss(toast.id)">✕</button>
    </div>
  }
</div>
