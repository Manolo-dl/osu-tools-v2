<header>
  <div class="header-left">
    <span class="app-name">osu-tools</span>
  </div>
  <div class="header-right">
    <button class="btn-theme" (click)="themeService.toggle()" [title]="themeLabel">
      <ng-icon [name]="themeIcon" size="18" />
    </button>
    <button class="btn-ghost" (click)="navStore.toggleMode()">
      @if (navStore.isUserMode()) {
        Dev Mode
      } @else {
        User Mode
      }
    </button>
  </div>
</header>
