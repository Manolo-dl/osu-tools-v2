@if (!dismissed()) {
    <div class="notice">
        <span class="notice-icon">⚠</span>
        <p class="notice-text">
            <strong>Distribution change incoming.</strong>
            This program will change drastically in how it's distributed.
            New versions will not be detected automatically —
            a full reinstall will be required when they become available.
        </p>
        <button class="dismiss-btn" (click)="dismiss()" title="Dismiss">✕</button>
    </div>
}
