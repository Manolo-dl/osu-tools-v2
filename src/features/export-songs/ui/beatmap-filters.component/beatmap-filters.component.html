<div class="filters">
  <span class="section-title">Filters</span>

  <div class="filter-group">
    <label>Mode</label>
    <div class="button-group">
      <button
        [class.active]="mode() === null"
        (click)="setMode(null)">All</button>
      @for (m of modes; track m.value) {
        <button
          [class.active]="mode() === m.value"
          (click)="setMode(m.value)">{{ m.label }}</button>
      }
    </div>
  </div>

  <div class="filter-group">
    <label>Status</label>
    <div class="button-group">
      <button
        [class.active]="status() === null"
        (click)="setStatus(null)">All</button>
      @for (s of statuses; track s.value) {
        <button
          [class.active]="status() === s.value"
          (click)="setStatus(s.value)">{{ s.label }}</button>
      }
    </div>
  </div>

  <div class="filter-group">
    <label>Stars</label>
    <div class="stars-range">
      <input
        type="number"
        min="0"
        max="10"
        step="0.5"
        placeholder="Min"
        (change)="setMinStars($any($event.target).value)"
      />
      <span>–</span>
      <input
        type="number"
        min="0"
        max="10"
        step="0.5"
        placeholder="Max"
        (change)="setMaxStars($any($event.target).value)"
      />
    </div>
  </div>
</div>
