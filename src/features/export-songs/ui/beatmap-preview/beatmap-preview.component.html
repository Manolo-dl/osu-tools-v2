<div class="preview">
  <span class="section-title">Preview</span>
  @if (store.filteredBeatmaps().length === 0) {
    <div class="empty">No beatmaps match the current filters</div>
  } @else {
    <div class="preview-list">
      @for (beatmap of store.filteredBeatmaps(); track beatmap.md5) {
        <div class="preview-item">
          <span class="title">{{ beatmap.title }}</span>
          <span class="artist">{{ beatmap.artist }}</span>
          <span class="stars">{{ beatmap.stars | number:'1.1-2' }}★</span>
          <span class="bpm">{{ beatmap.bpm }} BPM</span>
        </div>
      }
    </div>
  }
</div>
