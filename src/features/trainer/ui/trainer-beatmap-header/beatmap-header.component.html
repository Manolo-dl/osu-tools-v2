<div
  class="beatmap-header"
  [style.background-image]="tosu.backgroundUrl()"
>
  <div class="beatmap-header__overlay">
    <div class="beatmap-header__info">
      <h2 class="beatmap-header__title">
        {{ tosu.title() }} <span class="beatmap-header__artist">- {{ tosu.artist() }}</span>
      </h2>
      <p class="beatmap-header__meta">
        {{ tosu.version() }} · mapped by {{ tosu.mapper() }}
      </p>
    </div>

    <div class="beatmap-header__stars">
      ⭐ {{ tosu.stars() | number:'1.2-2' }}
    </div>
  </div>
</div>
