<div class="pipeline-panel">

  <div class="panel-header">
    <span class="section-title">Tasks</span>

    <select
      class="add-task-select"
      (change)="addTask($any($event.target).value); $any($event.target).value = ''"
    >
      <option value="" disabled selected>+ Add task</option>
      @for (type of availableTasksFiltered(); track type) {
        <option [value]="type">{{ taskLabels[type] }}</option>
      }
    </select>
  </div>

  <div class="task-list" cdkDropList (cdkDropListDropped)="onDrop($event)">

    @for (entry of trainer.tasks(); track entry.id) {
      <div class="task-item" cdkDrag>

        <span class="task-handle" cdkDragHandle>⋮⋮</span>

        <div class="task-content">
          <span class="task-label">{{ taskLabels[entry.task.type] }}</span>

          @if (entry.task.type === 'RateChange') {
            <div class="task-params">
              <input
                type="range" min="0.5" max="2" step="0.05"
                class="task-rate-slider"
                [value]="entry.task.params.rate"
                (input)="onRateChange(entry.id, +$any($event.target).value, entry.task.params.nightcore)"
              />
              <span class="task-rate-value">{{ entry.task.params.rate }}x</span>

              <label class="task-checkbox">
                <input
                  type="checkbox"
                  [checked]="entry.task.params.nightcore"
                  (change)="onRateChange(entry.id, entry.task.params.rate, $any($event.target).checked)"
                />
                Nightcore
              </label>
            </div>
          }

          @if (entry.task.type === 'Mirror') {
            <div class="task-params">
              <select
                class="task-axis-select"
                [value]="entry.task.params.axis"
                (change)="onMirrorChange(entry.id, $any($event.target).value)"
              >
                <option value="horizontal">Horizontal</option>
                <option value="vertical">Vertical</option>
              </select>
            </div>
          }
        </div>

        <button
          class="task-remove"
          type="button"
          title="Remove task"
          (click)="trainer.removeTask(entry.id)"
        >
          ✕
        </button>

      </div>
    }

    @if (trainer.tasks().length === 0) {
      <p class="empty-state">No tasks added yet.</p>
    }

  </div>

</div>
