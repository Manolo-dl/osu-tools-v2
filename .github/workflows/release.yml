name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # ⚡ Optimización: Cachea los node_modules

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2 # ⚡ Optimización: Cachea las compilaciones de Rust

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build and release
        uses: tauri-apps/tauri-action@v0 # 🛠️ Corregido: Versión v2 para Tauri v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: osu-tools ${{ github.ref_name }}
          releaseBody: |
            ## Downloads
            - **Linux** — `.AppImage` (portable) or `.deb` (Debian/Ubuntu)
            - **Windows** — `.exe` (installer) or `.msi`

            See the commit history for what changed in this release.
          releaseDraft: true
          prerelease: false