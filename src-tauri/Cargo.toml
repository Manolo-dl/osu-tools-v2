[package]
name = "osu-tools"
version = "0.5.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "osu_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
dirs = "6.0.0"
tauri-plugin-store = "2.4.3"
tauri-plugin-dialog = "2.7.1"
log = "0.4.30"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full", "time"] }
reqwest = { version = "0.13.4", features = ["cookies", "json"] }
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
osynic_osudb = "0.1.5"
tauri-plugin-notification = "2"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }
futures-util = "0.3.32"
regex = "1.12.4"
walkdir = "2.5.0"
chrono = "0.4.45"
zip = "8.6.0"
open = "5.3.5"
osu-db = { version = "0.3.0", default-features = false }
rosu-replay = "0.2.2"
tokio-tungstenite = "0.30.0"
anyhow = "1.0.104"
rosu-map = "0.2.1"
symphonia = { version = "0.6.0", features = ["all"] }
hound = "3.5.1"
soundtouch = { version = "0.5.4", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
